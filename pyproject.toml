[project]
name = "text-to-speech-chatterbox-tts"
version = "0.1.0"
description = "Texto a voz en español con Chatterbox Multilingual TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "setuptools<81",
]

[project.scripts]
text-to-speech-chatterbox-tts = "text_to_speech_chatterbox_tts:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
